{% extends "base.html" %} {% block content %}
<div class="container section-padding text-center">
  <div
    class="card glass-card p-5 animate-fade-in mx-auto"
    style="max-width: 600px"
  >
    <div class="cancel-icon mb-4">
      <svg
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        class="text-warning"
      >
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
        <line
          x1="15"
          y1="9"
          x2="9"
          y2="15"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
        <line
          x1="9"
          y1="9"
          x2="15"
          y2="15"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <h1 class="h2 mb-3">Payment Cancelled</h1>
    <p class="text-muted mb-5">Checkout was cancelled. No charges were made.</p>
    <div class="d-grid gap-3">
      <a
        href="{{ url_for('customer.checkout') }}"
        class="btn btn-primary rounded-pill"
        >Return to Checkout</a
      >
      <a
        href="{{ url_for('customer.view_cart') }}"
        class="btn btn-outline-secondary rounded-pill"
        >Back to Cart</a
      >
    </div>
  </div>
</div>
{% endblock %}
