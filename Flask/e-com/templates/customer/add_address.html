{% extends 'base.html' %} {% block title %}Add Address - E-Commerce Platform{%
endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card glass-card fade-in">
      <div class="card-header">
        <h2 class="h4 mb-0">Add Shipping Address</h2>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control rounded-pill"
              id="name"
              name="name"
              required
            />
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input
              type="tel"
              class="form-control rounded-pill"
              id="phone"
              name="phone"
              required
            />
          </div>

          <div class="mb-3">
            <label for="address_line1" class="form-label">Address Line 1</label>
            <input
              type="text"
              class="form-control rounded-pill"
              id="address_line1"
              name="address_line1"
              required
            />
          </div>

          <div class="mb-3">
            <label for="address_line2" class="form-label"
              >Address Line 2 (Optional)</label
            >
            <input
              type="text"
              class="form-control rounded-pill"
              id="address_line2"
              name="address_line2"
            />
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="city" class="form-label">City</label>
              <input
                type="text"
                class="form-control rounded-pill"
                id="city"
                name="city"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="state" class="form-label">State</label>
              <input
                type="text"
                class="form-control rounded-pill"
                id="state"
                name="state"
                required
              />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="postal_code" class="form-label">Postal Code</label>
              <input
                type="text"
                class="form-control rounded-pill"
                id="postal_code"
                name="postal_code"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="country" class="form-label">Country</label>
              <input
                type="text"
                class="form-control rounded-pill"
                id="country"
                name="country"
                value="USA"
                required
              />
            </div>
          </div>

          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="is_default"
              name="is_default"
            />
            <label class="form-check-label" for="is_default">
              Set as default address
            </label>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg rounded-pill">
              Save Address
            </button>
            <a
              href="{{ url_for('customer.addresses') }}"
              class="btn btn-outline-secondary btn-lg rounded-pill"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
