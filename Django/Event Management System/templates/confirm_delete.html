{% extends 'base.html' %} {% block title %}Confirm Deletion - Admin{% endblock
%} {% block content %}
<div class="row justify-content-center py-5 animate-up">
  <div class="col-md-5">
    <div class="card border-0 shadow-lg rounded-4 p-5 text-center">
      <div class="text-danger mb-4">
        <i class="bi bi-exclamation-triangle-fill display-2"></i>
      </div>
      <h2 class="fw-bold mb-3">Are you sure?</h2>
      <p class="text-muted mb-5">
        You are about to delete <strong>{{ object }}</strong>. This action is
        permanent and cannot be reversed.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-grid gap-3">
          <button
            type="submit"
            class="btn btn-danger py-3 rounded-pill fw-bold shadow-sm"
          >
            Yes, Confirm Deletion
          </button>
          <button
            type="button"
            onclick="history.back()"
            class="btn btn-light py-3 rounded-pill"
          >
            No, Keep This Record
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
