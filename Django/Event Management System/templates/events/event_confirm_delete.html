{% extends 'base.html' %}

{% block title %}Delete Event{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">
                    <i class="bi bi-exclamation-triangle"></i> Confirm Deletion
                </h4>
            </div>
            <div class="card-body">
                <p class="mb-4">
                    Are you sure you want to delete the event <strong>"{{ event.name }}"</strong>?
                </p>

                <div class="alert alert-warning">
                    <i class="bi bi-info-circle"></i>
                    This will also delete all associated bookings and guests!
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Yes, Delete
                        </button>
                        <a href="{% url 'events:event_detail' event.pk %}" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
