{% extends 'base.html' %} {% block title %}{{ title }} - Kalyanakumar{% endblock%} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card p-4">
      <h2
        class="fw-bold mb-4"
        style="font-family: &quot;Playfair Display&quot;, serif"
      >
        {{ title }}
      </h2>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="row">
          {% for field in form %}
          <div
            class="col-md-{% if field.name == 'venue_location' or field.name == 'client_name' %}12{% else %}6{% endif %} mb-3"
          >
            <label class="form-label fw-semibold">{{ field.label }}</label>
            {{ field }} {% if field.errors %}
            <div class="text-danger small">{{ field.errors }}</div>
            {% endif %}
          </div>
          {% endfor %}
        </div>
        <div class="mt-4">
          <button type="submit" class="btn btn-premium w-100">
            Save Event Details
          </button>
          <a
            href="{% url 'events:event_list' %}"
            class="btn btn-light w-100 mt-2 border-0"
            >Cancel</a
          >
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
