{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Upload Document - Hospital Management System{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-upload"></i> Upload Document for {{ patient.user.get_full_name }}</h2>
    <a href="{% url 'patients:patient_detail' patient.pk %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back to Patient
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}

                    <div class="text-end mt-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-upload"></i> Upload Document
                        </button>
                        <a href="{% url 'patients:patient_detail' patient.pk %}" class="btn btn-secondary btn-lg">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
