{% extends 'services/base.html' %}
{% block extra_css %}
<style>
    .star-rating {
        display: flex;
        flex-direction: row-reverse;
        justify-content: center;
        gap: 10px;
    }

    .star-rating input {
        display: none;
    }

    .star-rating label {
        font-size: 2.5rem;
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .star-rating label:hover,
    .star-rating label:hover~label,
    .star-rating input:checked~label {
        color: #fbbf24;
        transform: scale(1.1);
    }

    .review-textarea {
        background: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 20px !important;
        padding: 20px !important;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .review-textarea:focus {
        background: white !important;
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1) !important;
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5 animate-up">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-5">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-4"
                        style="width: 80px; height: 80px;">
                        <i class="bi bi-chat-heart-fill text-primary fs-1"></i>
                    </div>
                    <h2 class="fw-800 mb-2">Share Your Feedback</h2>
                    <p class="text-muted fw-500">How was your service with <span class="text-primary fw-bold">{{
                            booking.provider.name }}</span>?</p>
                </div>

                <form method="post" id="reviewForm">
                    {% csrf_token %}

                    <div class="mb-5 text-center">
                        <label
                            class="form-label fw-800 text-uppercase tracking-wider small text-muted mb-3 d-block">Overall
                            Rating</label>
                        <div class="star-rating">
                            <input type="radio" id="star5" name="rating" value="5" required /><label for="star5"
                                title="Amazing"><i class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="Good"><i
                                    class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star3" name="rating" value="3" /><label for="star3"
                                title="Average"><i class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="Poor"><i
                                    class="bi bi-star-fill"></i></label>
                            <input type="radio" id="star1" name="rating" value="1" /><label for="star1"
                                title="Very Bad"><i class="bi bi-star-fill"></i></label>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-800 text-uppercase tracking-wider small text-muted mb-2">Detailed
                            Comments</label>
                        <textarea name="comment" class="form-control review-textarea" rows="4"
                            placeholder="Tell us what you liked (or what could be better)..." required></textarea>
                    </div>

                    <div class="mb-4 bg-light p-3 rounded-4 d-flex align-items-center justify-content-between">
                        <div>
                            <label class="fw-bold mb-0">Was the professional on time?</label>
                            <p class="text-muted small mb-0">Helps us track punctuality</p>
                        </div>
                        <div class="form-check form-switch fs-4">
                            <input class="form-check-input" type="checkbox" name="was_on_time" id="onTimeSwitch"
                                checked>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-lg mb-3">
                        Submit Review & Complete <i class="bi bi-send-fill ms-2"></i>
                    </button>

                    <a href="{% url 'dashboard' %}"
                        class="btn btn-link w-100 text-muted text-decoration-none fw-bold small">Skip for now</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
