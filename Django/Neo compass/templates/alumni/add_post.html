{% extends 'base.html' %} {% block content %}
<div class="row">
  <div class="col-md-6 mx-auto">
    <div class="card p-5">
      <h2 class="fw-bold mb-4">
        Add <span class="text-gradient">Alumni Insight</span>
      </h2>
      <form method="POST">
        {% csrf_token %}
        {% if user.role == 'hod' or user.role == 'mentor' %}
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label fw-bold mb-0">Select Alumni</label>
            <a href="{% url 'add_alumni' %}" class="small text-decoration-none"
              >+ Create New Profile</a
            >
          </div>
          {{ form.alumni }}
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label fw-bold">Post Title</label>
          {{ form.title }}
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Content</label>
          {{ form.content }}
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg">
            Post Insight
          </button>
          <a href="{% url 'alumni_posts' %}" class="btn btn-outline-secondary"
            >Cancel</a
          >
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
