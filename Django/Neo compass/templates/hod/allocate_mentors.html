{% extends 'base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="glass-panel p-5">
      <div class="text-center mb-5">
        <div
          class="p-3 bg-primary bg-opacity-10 rounded-circle d-inline-block text-primary mb-3"
        >
          <i class="fas fa-sitemap fa-2x"></i>
        </div>
        <h2 class="fw-bold mb-1">
          Mentor <span class="text-gradient">Registry</span>
        </h2>
        <p class="text-muted small">
          Allocating experts to the <strong>{{ domain.name }}</strong> track.
        </p>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label small fw-bold text-muted mb-3 d-block"
            >SELECT MENTORS FOR THIS DOMAIN</label
          >
          <div class="row g-3">
            {% for m in all_mentors %}
            <div class="col-md-6">
              <div
                class="form-check p-3 rounded-4 border bg-light h-100 d-flex align-items-center"
              >
                <input
                  class="form-check-input ms-0 me-3"
                  type="checkbox"
                  name="mentor_ids"
                  value="{{ m.id }}"
                  id="mentor_{{ m.id }}"
                  {%
                  if
                  m
                  in
                  domain.mentors.all
                  %}checked{%
                  endif
                  %}
                />
                <label class="form-check-label w-100" for="mentor_{{ m.id }}">
                  <h6 class="fw-bold mb-0">{{ m.username }}</h6>
                  <small class="text-muted">{{ m.email }}</small>
                </label>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>

        <div class="d-grid gap-3 pt-4">
          <button type="submit" class="btn btn-primary py-3 fw-bold shadow">
            <i class="fas fa-save me-2"></i> Update Allocation
          </button>
          <a
            href="{% url 'hod_domains' %}"
            class="btn btn-light py-3 text-muted"
            >Discard Changes</a
          >
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .form-check-input:checked + .form-check-label {
    color: var(--primary);
  }
  .form-check:has(.form-check-input:checked) {
    border-color: var(--primary) !important;
    background: rgba(79, 70, 229, 0.05) !important;
  }
</style>
{% endblock %}
