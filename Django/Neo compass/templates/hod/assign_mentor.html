{% extends 'base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="glass-panel p-5">
      <div class="text-center mb-5">
        <div
          class="p-3 bg-primary bg-opacity-10 rounded-circle d-inline-block text-primary mb-3"
        >
          <i class="fas fa-link fa-2x"></i>
        </div>
        <h2 class="fw-bold mb-1">
          Mentor <span class="text-gradient">Allocation</span>
        </h2>
        <p class="text-muted small">
          Connect students with the right institutional guidance.
        </p>
      </div>

      <div class="bg-light p-4 rounded-4 mb-5 border">
        <div class="d-flex align-items-center">
          <div
            class="bg-white rounded-circle shadow-sm d-flex align-items-center justify-content-center me-3"
            style="width: 50px; height: 50px"
          >
            <i class="fas fa-user-graduate text-primary"></i>
          </div>
          <div>
            <h6 class="fw-bold mb-0">
              Target Student:
              <span class="text-primary">{{ profile.user.username }}</span>
            </h6>
            <p class="text-muted small mb-0">
              Interest: {{ profile.interest|default:"Not specified" }}
            </p>
          </div>
        </div>
      </div>

      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label small fw-bold text-muted"
            >CHOOSE EXPERT MENTOR</label
          >
          <select
            name="mentor_id"
            class="form-select py-3 px-4 shadow-sm"
            style="border-radius: 12px"
          >
            <option value="" disabled selected>
              — Select an expert from the list —
            </option>
            {% for m in mentors %}
            <option value="{{ m.id }}">{{ m.username }} ({{ m.email }})</option>
            {% endfor %}
          </select>
        </div>

        <div class="d-grid gap-3 pt-3">
          <button type="submit" class="btn btn-primary py-3 fw-bold shadow">
            <i class="fas fa-check-circle me-2"></i> Confirm Assignment
          </button>
          <a href="{% url 'hod_users' %}" class="btn btn-light py-3 text-muted"
            >Cancel Operations</a
          >
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
