{% extends 'base.html' %} {% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="card-header bg-primary py-4 px-5">
          <h3 class="fw-bold text-white mb-0">
            <i class="fas fa-edit me-2"></i>Update Resource
          </h3>
        </div>
        <div class="card-body p-5">
          <div
            class="mb-4 d-flex align-items-center gap-3 p-3 bg-light rounded-3"
          >
            <div class="bg-primary text-white p-2 rounded-2">
              <i class="fas fa-folder-open"></i>
            </div>
            <div>
              <p class="small text-muted mb-0">Editing resource for:</p>
              <h6 class="fw-bold mb-0 text-slate">{{ domain.name }}</h6>
            </div>
          </div>

          <form method="post">
            {% csrf_token %}
            <div class="mb-4">
              <label class="form-label fw-bold">Title</label>
              {{ form.title }}
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Description</label>
              {{ form.description }}
            </div>
            <div class="mb-5">
              <label class="form-label fw-bold"
                >Reference Link (Video/Article)</label
              >
              {{ form.youtube_link }}
            </div>
            <div class="d-grid gap-3">
              <button type="submit" class="btn btn-primary py-3 fw-bold">
                <i class="fas fa-save me-2"></i> Update Resource
              </button>
              <a
                href="{% url 'mentor_domain_curriculum' domain.id %}"
                class="btn btn-light py-3 fw-bold text-muted"
              >
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
