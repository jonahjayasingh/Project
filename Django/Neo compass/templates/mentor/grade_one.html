{% extends 'base.html' %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="glass-panel">
      <h2 class="fw-bold mb-4">Grade Submission</h2>
      <p><strong>Student:</strong> {{ submission.student.username }}</p>
      <p><strong>Assignment:</strong> {{ submission.assignment.title }}</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Score (0-100)</label>
          <input
            type="number"
            name="mentor_score"
            class="form-control bg-dark text-white"
            value="{{ submission.mentor_score|default:'' }}"
          />
        </div>
        <div class="mb-3">
          <label class="form-label">Feedback</label>
          <textarea
            name="mentor_feedback"
            class="form-control bg-dark text-white"
            rows="3"
          >
{{ submission.mentor_feedback|default:'' }}</textarea
          >
        </div>
        <button type="submit" class="btn btn-primary w-100">Save Grade</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
