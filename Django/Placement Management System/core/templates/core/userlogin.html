{% extends 'core/base.html' %}

{% block title %}Login | PlacementPro{% endblock %}

{% block layout %}
<main>
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div
                style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <h2 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary);">
                Welcome Back
            </h2>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">Sign in to access your dashboard</p>
        </div>

        <form method="POST" id="loginForm">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn" style="width: 100%;">
                <span id="btnText">Sign In</span>
                <span id="btnLoader" style="display: none;">
                    <svg style="display: inline-block; width: 20px; height: 20px; animation: spin 0.8s linear infinite;"
                        viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" stroke-opacity="0.25">
                        </circle>
                        <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="4" stroke-linecap="round">
                        </path>
                    </svg>
                </span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">
                New student? <a href="{% url 'student_register' %}"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Create an account</a>
            </p>
        </div>
    </div>
</main>

<style>
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .btn-primary:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    .form-group input:focus {
        border-color: var(--primary);
    }

    a:hover {
        text-decoration: underline;
    }
</style>

<script>
    // Add loading state on form submit
    document.getElementById('loginForm').addEventListener('submit', function () {
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');

        btn.disabled = true;
        btnText.style.display = 'none';
        btnLoader.style.display = 'inline-block';
    });
</script>
{% endblock %}
