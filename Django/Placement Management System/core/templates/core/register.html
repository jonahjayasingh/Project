{% extends 'core/base.html' %}

{% block title %}Register | PlacementPro{% endblock %}

{% block layout %}
<main>
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div
                style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--secondary), var(--accent)); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <h2 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-primary);">Create
                Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">Register to join the placement network</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="register_number">Register Number</label>
                <input type="text" id="register_number" name="register_number" placeholder="e.g. 2024CS001" required>
            </div>
            <div class="form-group">
                <label for="year_of_study">Year of Study</label>
                <select id="year_of_study" name="year_of_study" required>
                    <option value="">Select current year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year (Final)</option>
                </select>
                <small style="color: var(--warning); font-size: 0.8125rem; margin-top: 0.5rem; display: block;">
                    * Registration restricted to Final Year students
                </small>
            </div>
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="e.g. Computer Science" required>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%;">
                Complete Registration
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">
                Already have an account? <a href="{% url 'userlogin' %}"
                    style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
            </p>
        </div>
    </div>
</main>
{% endblock %}
