{% extends 'resorts/base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center animate-in">
    <div class="col-md-6">
        <div class="card p-5 text-center">
            <div class="mb-4">
                <div
                    class="d-inline-flex align-items-center justify-content-center  bg-danger bg-opacity-10 p-4">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                </div>
            </div>
            <h2 class="fw-bold mb-3">Confirm Deletion</h2>
            <p class="text-muted mb-4">
                Are you sure you want to delete <strong class="text-danger">{{ object }}</strong>?
                <br>This action cannot be undone.
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-danger btn-lg py-3">
                        <i class="bi bi-trash me-2"></i>Delete Permanently
                    </button>
                    <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-primary py-3">
                        <i class="bi bi-x-circle me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
