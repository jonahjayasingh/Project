{% extends 'resorts/base.html' %}
{% block content %}
<div class="auth-wrapper d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4 animate-in">
                <div class="text-center mb-5">
                    <h6 class="text-primary fw-bold text-uppercase tracking-widest mb-3">AUTHENTICATION</h6>
                    <h1 class="display-5 fw-bold mb-0">Welcome <span class="gradient-text">Back</span></h1>
                </div>

                <div class="card border-0 p-4 p-md-5 shadow-premium"
                    style="border-radius: 40px; background: var(--bg-card);">
                    <form method="post" novalidate id="login-form">
                        {% csrf_token %}

                        {% if form.errors or form.non_field_errors %}
                        <div class="alert alert-danger border-0 smallest fw-bold text-uppercase tracking-widest mb-4"
                            style="border-radius: 12px;">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid Credentials
                        </div>
                        {% endif %}

                        <div class="mb-4">
                            <label
                                class="smallest text-primary fw-bold text-uppercase tracking-widest mb-2 d-block">Username</label>
                            <div class="premium-input-box">
                                <i class="bi bi-person text-muted"></i>
                                {{ form.username }}
                            </div>
                        </div>

                        <div class="mb-5">
                            <label
                                class="smallest text-primary fw-bold text-uppercase tracking-widest mb-2 d-block">Secret
                                Code</label>
                            <div class="premium-input-box">
                                <i class="bi bi-shield-lock text-muted"></i>
                                {{ form.password }}
                                <span class="password-toggle-trigger" id="togglePassword">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </span>
                            </div>
                        </div>

                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-lg py-3 shadow-premium"
                                style="border-radius: 18px; font-weight: 700;">
                                ENTER RESORT
                            </button>
                        </div>
                    </form>

                    <div class="text-center">
                        <div class="smallest text-muted text-uppercase tracking-widest fw-bold mb-3">New Explorer?</div>
                        <a href="{% url 'register' %}" class="btn btn-light w-100 py-3"
                            style="border-radius: 18px; font-weight: 600;">
                            Create New Account
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .auth-wrapper {
        min-height: 80vh;
    }

    .premium-input-box {
        position: relative;
        display: flex;
        align-items: center;
    }

    .premium-input-box i:not(.bi-eye):not(.bi-eye-slash) {
        position: absolute;
        left: 20px;
        font-size: 1.2rem;
    }

    .premium-input-box input {
        width: 100%;
        padding: 1.1rem 1.5rem 1.1rem 55px;
        background: #f8fafc;
        border: 2px solid transparent;
        border-radius: 16px;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .premium-input-box input:focus {
        outline: none;
        background: white;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .password-toggle-trigger {
        position: absolute;
        right: 20px;
        cursor: pointer;
        color: var(--text-muted);
        transition: color 0.3s;
    }

    .password-toggle-trigger:hover {
        color: var(--primary);
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.querySelector('input[name="password"]');
        const toggleIcon = document.getElementById('toggleIcon');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.classList.toggle('bi-eye');
                toggleIcon.classList.toggle('bi-eye-slash');
            });
        }

        // Add placeholders
        document.querySelector('input[name="username"]').placeholder = "Your identification";
        document.querySelector('input[name="password"]').placeholder = "Your private key";
    });
</script>
{% endblock %}
