{% extends 'base.html' %}

{% block title %}Add Transaction - Finance Manager{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white shadow overflow-hidden sm:rounded-lg">
    <div class="px-4 py-5 sm:px-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900">Add New Transaction</h3>
        <p class="mt-1 max-w-2xl text-sm text-gray-500">Enter the details of your transaction below.</p>
    </div>
    <div class="border-t border-gray-200 px-4 py-5 sm:p-6">
        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="type" class="block text-sm font-medium text-gray-700">Type</label>
                <select id="type" name="type" required
                    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
                    <option value="EXPENSE">Expense</option>
                    <option value="INCOME">Income</option>
                </select>
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <div class="mt-1">
                    <input type="text" name="description" id="description" required
                        class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
                </div>
            </div>

            <div>
                <label for="amount" class="block text-sm font-medium text-gray-700">Amount</label>
                <div class="mt-1 relative rounded-md shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="text-gray-500 sm:text-sm">$</span>
                    </div>
                    <input type="number" step="0.01" name="amount" id="amount" required
                        class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-7 sm:text-sm border-gray-300 rounded-md border p-2">
                </div>
            </div>

            <div>
                <label for="date" class="block text-sm font-medium text-gray-700">Date</label>
                <div class="mt-1">
                    <input type="date" name="date" id="date" required value="{% now 'Y-m-d' %}"
                        class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md border p-2">
                </div>
            </div>

            <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-2">
                <div>
                    <div class="flex justify-between items-center">
                        <label for="category" class="block text-sm font-medium text-gray-700">Category</label>
                    </div>
                    <select id="category" name="category"
                        class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
                        <option value="">Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" data-type="{{ cat.type }}">{{ cat.name }} ({{
                            cat.get_type_display}})</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <div class="flex justify-between items-center">
                        <label for="account" class="block text-sm font-medium text-gray-700">Account</label>
                    </div>
                    <select id="account" name="account" required
                        class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md border">
                        {% for acc in accounts %}
                        <option value="{{ acc.id }}">{{ acc.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="pt-5">
                <div class="flex justify-end">
                    <a href="{% url 'dashboard' %}"
                        class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Cancel
                    </a>
                    <button type="submit"
                        class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Save Transaction
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const typeSelect = document.getElementById('type');
        const categorySelect = document.getElementById('category');
        const options = Array.from(categorySelect.options);

        function filterCategories() {
            const selectedType = typeSelect.value;
            const currentCategory = categorySelect.value;

            // Reset selection if current option is being hidden
            let isCurrentValid = false;

            categorySelect.innerHTML = '';

            // Always add default option
            options.forEach(option => {
                if (option.value === "") {
                    categorySelect.appendChild(option);
                } else if (option.dataset.type === selectedType) {
                    categorySelect.appendChild(option);
                    if (option.value === currentCategory) {
                        isCurrentValid = true;
                    }
                }
            });

            if (isCurrentValid) {
                categorySelect.value = currentCategory;
            } else {
                categorySelect.value = "";
            }
        }

        typeSelect.addEventListener('change', filterCategories);

        // Initial filter
        filterCategories();
    });
</script>
{% endblock %}
