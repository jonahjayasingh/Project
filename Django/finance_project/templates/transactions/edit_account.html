{% extends 'base.html' %}

{% block title %}Edit Account - Finance Manager{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow overflow-hidden sm:rounded-lg">
    <div class="px-4 py-5 sm:px-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900">Edit Account</h3>
    </div>
    <div class="border-t border-gray-200 px-4 py-5 sm:p-6">
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700">{{ field.label}}</label>
                <div class="mt-1">
                    {{ field }}
                    {% for error in field.errors %}
                    <p class="mt-2 text-sm text-red-600">{{ error }}</p>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
            <div class="pt-5">
                <div class="flex justify-end">
                    <a href="{% url 'manage_data' %}"
                        class="bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Cancel
                    </a>
                    <button type="submit"
                        class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
