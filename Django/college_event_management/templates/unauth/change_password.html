{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Coast University | Change Password</title>
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            color: #333;
            padding-top: 80px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            background: white;
            margin-top: 50px;
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            padding: 1.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-control {
            border-radius: 8px;
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .error {
            color: var(--accent-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .success {
            color: #28a745;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .form-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-header i {
            font-size: 3rem;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
        }

        .form-header h3 {
            margin: 0;
            font-weight: 600;
            color: var(--primary-color);
        }

        @media (max-width: 576px) {
            .card-body {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-key"></i> Change Password
            </div>
            <div class="card-body">
                <div class="form-header">
                    <i class="fas fa-lock"></i>
                    <h3>Change Password</h3>
                    <p>Enter your old password and set a new one (8+ characters)</p>
                </div>
                <form id="changePasswordForm" method="POST" action="{% url 'coordinator:change_password' %}">
                    {% csrf_token %}
                    <input type="password" class="form-control" id="oldPassword" name="old_password" placeholder="Old Password" required>
                    <input type="password" class="form-control" id="newPassword" name="new_password" placeholder="New Password (8+ chars)" required>
                    <input type="password" class="form-control" id="confirmPassword" name="confirm_password" placeholder="Confirm New Password" required>
                    <div id="message"></div>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-key me-1"></i> Change Password</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Messages as tooltips -->
    <div id="django-messages" class="d-none">
        {% if messages %}
            {% for message in messages %}
                <span 
                    class="d-inline-block" 
                    tabindex="0" 
                    data-bs-toggle="tooltip" 
                    data-bs-placement="top" 
                    title="{{ message }}" 
                    data-bs-custom-class="bg-{{ message.tags }} text-white">
                </span>
            {% endfor %}
        {% endif %}
    </div>

    <script src="{% static 'bootstrap.bundle.min.js' %}"></script>
    <script>
        // Form validation
        const form = document.getElementById('changePasswordForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', function(e) {
            messageDiv.textContent = '';
            messageDiv.className = '';

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                e.preventDefault();
                messageDiv.textContent = 'New password must be at least 8 characters.';
                messageDiv.classList.add('error');
                return;
            }

            if (newPassword !== confirmPassword) {
                e.preventDefault();
                messageDiv.textContent = 'New password and confirm password do not match.';
                messageDiv.classList.add('error');
                return;
            }

            if (oldPassword === newPassword) {
                e.preventDefault();
                messageDiv.textContent = 'New password cannot be the same as old password.';
                messageDiv.classList.add('error');
                return;
            }
        });

        // Initialize Bootstrap tooltips
        document.addEventListener('DOMContentLoaded', function () {
            var tooltipElements = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            tooltipElements.forEach(function(el) {
                var tooltip = new bootstrap.Tooltip(el);
                // Show tooltip immediately
                tooltip.show();
                // Hide after 3 seconds
                setTimeout(() => tooltip.hide(), 3000);
            });
        });
    </script>
</body>
</html>
