{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="bg-primary py-4 text-center">
                <span class="fs-1">🔐</span>
                <h2 class="text-white fw-bold mb-0">Secure Login</h2>
            </div>
            <div class="card-body p-5">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark fs-6">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger mt-1 small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-3 mt-2 shadow-sm">Sign In to
                        Dashboard</button>
                </form>
                <div class="mt-5 text-center">
                    <p class="text-muted">Don't have an account yet?
                        <a href="{% url 'register' %}" class="text-primary fw-bold text-decoration-none ms-1">Register
                            Now</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid #E2E8F0;
        border-radius: 12px;
    }

    input:focus {
        outline: none;
        border-color: #4F46E5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }
</style>
{% endblock %}
