{% extends "base.html" %}

{% block title %}{{ page.title }} - Lab Secure{% endblock %}

{% block content %}
<div class="row pt-5 justify-content-center">
    <div class="col-md-9">
        <div class="card p-5 border-0 shadow-sm rounded-4">
            <h1 class="fw-bold mb-4" style="color: var(--primary-color);">{{ page.title }}</h1>
            <div class="content-body" style="line-height: 1.8; color: #475569;">
                {{ page.content|safe|linebreaks }}
            </div>

            <hr class="my-5 opacity-10">

            <div class="d-flex justify-content-between align-items-center">
                <p class="small text-muted mb-0">Last updated: {{ page.updated_at|date:"F d, Y" }}</p>
                <a href="{% url 'home' %}" class="btn btn-outline-primary btn-sm rounded-pill px-4">Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
