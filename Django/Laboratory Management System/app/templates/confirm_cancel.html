{% extends "base.html" %}

{% block title %}Confirm Cancellation - LMS{% endblock %}

{% block content %}
<div class="row pt-5 justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 border-0 shadow-lg rounded-4 text-center">
            <div class="bg-danger bg-opacity-10 p-3 rounded-circle d-inline-block mb-3">
                <i class="fas fa-exclamation-triangle fa-2x text-danger"></i>
            </div>
            <h3 class="fw-bold mb-3">Cancel Booking?</h3>
            <p class="text-muted mb-4">Are you sure you want to cancel your booking for <strong>{{ booking.test_name
                    }}</strong> on {{ booking.booking_date }}?</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4 text-start">
                    <label class="form-label small fw-bold">Reason for Cancellation</label>
                    <select name="reason" class="form-select" required>
                        <option value="Change of plans">Change of plans</option>
                        <option value="Found better price elsewhere">Found better price elsewhere</option>
                        <option value="Personal emergency">Personal emergency</option>
                        <option value="Health improved">Health improved</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger w-100 py-2 rounded-pill fw-bold">Yes, Cancel
                        Booking</button>
                    <a href="{% url 'patient_dashboard' %}" class="btn btn-light w-100 py-2 rounded-pill fw-bold">No,
                        Keep It</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
