{% extends 'base.html' %}

{% block title %}Live Camera - TrafficSign AI{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="glass-card">
        <h2 style="margin-bottom: 1.5rem;"><i class="fas fa-video" style="color: #ef4444;"></i> Live Traffic Sign
            Detection</h2>

        <div
            style="position: relative; border-radius: 15px; overflow: hidden; background: black; aspect-ratio: 16/9; max-width: 800px; margin: 0 auto; border: 1px solid var(--glass-border);">
            <video id="video" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
            <div id="status"
                style="position: absolute; top: 1rem; left: 1rem; padding: 0.5rem 1rem; border-radius: 50px; background: rgba(0,0,0,0.6); font-size: 0.8rem; display: flex; align-items: center; gap: 8px;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: #94a3b8;" id="status-dot"></div>
                <span id="status-text">Click Connect to Start</span>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
            <button id="start" class="btn btn-primary" style="padding: 0.8rem 2rem;">
                <i class="fas fa-play"></i> Connect Camera
            </button>
            <button id="stop" class="btn btn-outline" style="padding: 0.8rem 2rem; display: none;">
                <i class="fas fa-stop"></i> Stop
            </button>
        </div>

        <div style="margin-top: 2rem; color: var(--text-dim); font-size: 0.9rem; text-align: center;">
            <p><i class="fas fa-info-circle"></i> This stream is processed on the server using YOLOv8 via WebRTC.</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    var pc = null;
    var localStream = null;

    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const video = document.getElementById('video');

    function updateStatus(state, text) {
        statusText.innerText = text;
        if (state === 'connecting') statusDot.style.background = '#fbbf24';
        else if (state === 'connected') statusDot.style.background = '#10b981';
        else if (state === 'stopped') statusDot.style.background = '#94a3b8';
    }

    async function start() {
        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-flex';
        updateStatus('connecting', 'Negotiating...');
        console.log("Starting WebRTC connection...");

        var config = {
            sdpSemantics: 'unified-plan',
            iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
        };

        pc = new RTCPeerConnection(config);

        pc.addEventListener('track', function (evt) {
            console.log("Track event received:", evt.track.kind);
            if (evt.track.kind == 'video') {
                if (evt.streams && evt.streams[0]) {
                    video.srcObject = evt.streams[0];
                } else {
                    console.log("No stream found, creating one...");
                    const stream = new MediaStream([evt.track]);
                    video.srcObject = stream;
                }
                video.play().catch(e => console.log("Play error:", e));
            }
        });

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true });
            console.log("Got local media stream");
            localStream.getTracks().forEach(function (track) {
                pc.addTrack(track, localStream);
            });
        } catch (e) {
            console.error('Could not access camera:', e);
            alert('Could not access camera: ' + e);
            stop();
            return;
        }

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Wait for ICE gathering to complete (or at least start)
        await new Promise((resolve) => {
            if (pc.iceGatheringState === 'complete') {
                resolve();
            } else {
                function checkState() {
                    if (pc.iceGatheringState === 'complete') {
                        pc.removeEventListener('icegatheringstatechange', checkState);
                        resolve();
                    }
                }
                pc.addEventListener('icegatheringstatechange', checkState);
                // Fallback timeout
                setTimeout(resolve, 1000);
            }
        });

        console.log("Sending offer to server...");

        try {
            const response = await fetch("{% url 'rtc_offer' %}", {
                method: 'POST',
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const answer = await response.json();
            console.log("Received answer from server");
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
            updateStatus('connected', 'Live - AI Active');
        } catch (e) {
            console.error("Signal exchange failed:", e);
            updateStatus('stopped', 'Signal Failed');
            stop();
        }
    }


    function stop() {
        if (pc) {
            pc.close();
            pc = null;
        }
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        video.srcObject = null;
        startBtn.style.display = 'inline-flex';
        stopBtn.style.display = 'none';
        updateStatus('stopped', 'Connection Closed');
    }

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
</script>
{% endblock %}
