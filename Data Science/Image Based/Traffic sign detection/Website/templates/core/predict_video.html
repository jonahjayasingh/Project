{% extends 'base.html' %}

{% block title %}Live Camera - TrafficSign AI{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="glass-card">
        <h2 style="margin-bottom: 1.5rem;"><i class="fas fa-video" style="color: #ef4444;"></i> Live Traffic Sign
            Detection</h2>

        <div
            style="position: relative; border-radius: 15px; overflow: hidden; background: black; aspect-ratio: 16/9; max-width: 800px; margin: 0 auto; border: 1px solid var(--glass-border);">
            <video id="video" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
            <div id="status"
                style="position: absolute; top: 1rem; left: 1rem; padding: 0.5rem 1rem; border-radius: 50px; background: rgba(0,0,0,0.6); font-size: 0.8rem; display: flex; align-items: center; gap: 8px;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; transition: all 0.3s;" id="status-dot"></div>
                <span id="status-text">Click Connect to Start</span>
            </div>
        </div>

        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
            <button id="start" class="btn btn-primary" style="padding: 0.8rem 2rem;">
                <i class="fas fa-play"></i> Connect Camera
            </button>
            <button id="stop" class="btn btn-outline" style="padding: 0.8rem 2rem; display: none;">
                <i class="fas fa-stop"></i> Stop
            </button>
        </div>

        <div style="margin-top: 2rem; color: var(--text-dim); font-size: 0.9rem; text-align: center;">
            <p><i class="fas fa-info-circle"></i> This stream is processed on the server using YOLOv8 via OpenCV.</p>
        </div>
    </div>
</div>

<style>
    @keyframes pulse {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.5); opacity: 0.7; }
        100% { transform: scale(1); opacity: 1; }
    }
    .pulse {
        animation: pulse 2s infinite ease-in-out;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    let isRunning = false;
    let stream = null;
    const video = document.getElementById('video');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    
    // Hidden canvas for capturing frames
    const captureCanvas = document.createElement('canvas');
    const captureCtx = captureCanvas.getContext('2d');

    function updateStatus(state, text) {
        statusText.innerText = text;
        if (state === 'connecting' || state === 'processing') {
            statusDot.style.background = '#fbbf24';
            statusDot.style.boxShadow = '0 0 10px #fbbf24';
            statusDot.classList.add('pulse');
        } else if (state === 'active') {
            statusDot.style.background = '#10b981';
            statusDot.style.boxShadow = '0 0 10px #10b981';
            statusDot.classList.add('pulse');
        } else if (state === 'stopped') {
            statusDot.style.background = '#94a3b8';
            statusDot.style.boxShadow = 'none';
            statusDot.classList.remove('pulse');
        }
    }

    async function start() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { width: 640, height: 480 } 
            });
            video.srcObject = stream;
            isRunning = true;
            
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-flex';
            updateStatus('active', 'Live - OpenCV Active');
            
            processFrame();
        } catch (err) {
            console.error("Camera access error:", err);
            alert("Could not access camera.");
        }
    }

    async function processFrame() {
        if (!isRunning) return;

        // Set canvas size to video size if not already set
        if (captureCanvas.width !== video.videoWidth) {
            captureCanvas.width = video.videoWidth || 640;
            captureCanvas.height = video.videoHeight || 480;
        }

        // Draw current video frame to hidden canvas
        captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
        const imageData = captureCanvas.toDataURL('image/jpeg', 0.7);

        try {
            const response = await fetch("{% url 'predict_frame' %}", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });
            
            const result = await response.json();
            
            if (result.image && isRunning) {
                // We actually want to show the annotated image FROM the server
                // So we replace the video feed's visual with the result if preferred, 
                // but let's just update the video element's overlay or replace it.
                // A better way is to have an <img> tag for the result.
                
                let resultImg = document.getElementById('result-img');
                if (!resultImg) {
                    resultImg = document.createElement('img');
                    resultImg.id = 'result-img';
                    resultImg.style.position = 'absolute';
                    resultImg.style.top = '0';
                    resultImg.style.left = '0';
                    resultImg.style.width = '100%';
                    resultImg.style.height = '100%';
                    resultImg.style.objectFit = 'cover';
                    video.parentElement.appendChild(resultImg);
                    video.style.opacity = '0'; // Hide original video
                }
                resultImg.src = result.image;
            }
        } catch (e) {
            console.error("Frame processing error:", e);
        }

        // Delay slightly to keep CPU/Network usage reasonable (~15fps)
        if (isRunning) {
            setTimeout(processFrame, 60);
        }
    }

    function stop() {
        isRunning = false;
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        video.srcObject = null;
        
        const resultImg = document.getElementById('result-img');
        if (resultImg) resultImg.remove();
        video.style.opacity = '1';

        startBtn.style.display = 'inline-flex';
        stopBtn.style.display = 'none';
        updateStatus('stopped', 'Connection Closed');
    }

    startBtn.addEventListener('click', start);
    stopBtn.addEventListener('click', stop);
</script>
{% endblock %}
