{% extends 'base.html' %}

{% block title %}Login - TrafficSign AI{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto;">
    <div class="glass-card fade-in">
        <h2 style="text-align: center; margin-bottom: 2rem; font-size: 1.8rem;">Welcome Back</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control"
                    placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="••••••••"
                    required>
            </div>
            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; padding: 0.8rem; margin-top: 1rem;">
                Login
            </button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-dim); font-size: 0.9rem;">
            Don't have an account? <a href="{% url 'register' %}"
                style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
