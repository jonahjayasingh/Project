<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
    Cyberbulling Detection
    {% endblock %}
    </title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        nav h1 {
            margin: 0;
        }

        nav ul {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: black;
            font-size: 20px;
        }
        {% block style %}
        {% endblock %}

    </style>
</head>
<body>
    <nav>
    <h1>Cyberbullying Detection</h1>

    <ul>
        <li><a href="{% url 'home' %}">Home</a></li>

        {% if user.is_authenticated %}
            <li><a href="{% url 'predict' %}">Predict</a></li>
            <li><a href="{% url 'logout' %}">Logout</a></li>
        {% else %}
            <li><a href="{% url 'login' %}">Login</a></li>
            <li><a href="{% url 'register' %}">Register</a></li>
        {% endif %}
    </ul>
</nav>
    
    {% block content %}
    {% endblock %}
</body>
</html>
