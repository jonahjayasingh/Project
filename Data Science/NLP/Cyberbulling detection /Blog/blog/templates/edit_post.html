{% extends "base.html" %}

{% block title %}Edit Post | CyberBlog{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <div
        style="background: white; padding: 3rem; border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 3rem;">
            <div
                style="display: inline-flex; align-items: center; gap: 0.5rem; background: var(--accent-light); color: var(--accent); padding: 0.5rem 1rem; border-radius: 100px; margin-bottom: 1.5rem; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                </svg>
                Edit Mode
            </div>
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.75rem; color: var(--text-main);">Edit Post
            </h1>
            <p style="color: var(--text-secondary); font-size: 1rem;">Update your post. Content will be re-scanned for
                safety.</p>
        </div>

        <form method="post" class="post-form">
            {% csrf_token %}
            <style>
                .form-group {
                    margin-bottom: 2rem;
                }

                .form-group label {
                    display: block;
                    margin-bottom: 0.75rem;
                    font-weight: 700;
                    font-size: 0.9rem;
                    color: var(--text-main);
                }

                .post-form input[type="text"],
                .post-form textarea {
                    width: 100%;
                    padding: 1rem 1.25rem;
                    background: white;
                    border: 2px solid var(--border);
                    border-radius: 12px;
                    color: var(--text-main);
                    font-family: inherit;
                    font-size: 1rem;
                    transition: all 0.2s;
                }

                .post-form input[type="text"]:focus,
                .post-form textarea:focus {
                    outline: none;
                    border-color: var(--accent);
                    box-shadow: 0 0 0 3px var(--accent-light);
                }

                .post-form textarea {
                    min-height: 300px;
                    line-height: 1.6;
                }
            </style>

            <div class="form-group">
                <label>Title</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label>Content</label>
                {{ form.content }}
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                <a href="{% url 'post_detail' object.slug %}" class="btn btn-outline"
                    style="padding: 0.75rem 1.5rem;">Cancel</a>
                <button type="submit" class="btn" style="padding: 0.75rem 2rem; background: var(--accent);">Update
                    Post</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
