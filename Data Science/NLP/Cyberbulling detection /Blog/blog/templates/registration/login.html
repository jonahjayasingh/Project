{% extends "base.html" %}

{% block title %}Sign In | CyberBlog{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div
        style="background: white; padding: 3rem; border-radius: 24px; border: 1px solid var(--border); box-shadow: var(--shadow-xl);">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-main);">Welcome
                Back</h1>
            <p style="color: var(--text-secondary);">Sign in to continue to CyberBlog</p>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            <style>
                .auth-form p {
                    margin-bottom: 1.5rem;
                }

                .auth-form label {
                    display: block;
                    margin-bottom: 0.5rem;
                    font-weight: 600;
                    font-size: 0.9rem;
                    color: var(--text-main);
                }

                .auth-form input {
                    width: 100%;
                    padding: 0.875rem 1rem;
                    background: white;
                    border: 2px solid var(--border);
                    border-radius: 10px;
                    color: var(--text-main);
                    font-family: inherit;
                    font-size: 1rem;
                    transition: all 0.2s;
                }

                .auth-form input:focus {
                    outline: none;
                    border-color: var(--primary);
                    box-shadow: 0 0 0 3px var(--primary-light);
                }
            </style>
            {{ form.as_p }}
            <button type="submit" class="btn"
                style="width: 100%; padding: 0.875rem; font-size: 1rem; margin-top: 1rem;">Sign In</button>
        </form>

        <div style="margin-top: 2rem; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
            Don't have an account? <a href="{% url 'register' %}"
                style="color: var(--primary); text-decoration: none; font-weight: 700;">Sign up</a>
        </div>
    </div>
</div>
{% endblock %}
