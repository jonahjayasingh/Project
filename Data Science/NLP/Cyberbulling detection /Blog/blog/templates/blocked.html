<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Blocked - CyberBlog</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 3rem;
            background: #1e293b;
            border-radius: 24px;
            border: 1px solid #ef4444;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.1);
        }

        h1 {
            color: #ef4444;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            color: #94a3b8;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: block;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <div class="container">
        <span class="logo">CyberBlog</span>
        <h1>Access Denied</h1>
        <p>Your account has been <strong>permanently blocked</strong> due to repeated violations of our community
            guidelines regarding cyberbullying.</p>
        <p>This action is irreversible.</p>
    </div>
</body>

</html>
