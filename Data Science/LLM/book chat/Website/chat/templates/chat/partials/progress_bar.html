<div id="progress-container" hx-get="{% url 'upload_progress' %}" hx-trigger="every 1.5s" hx-swap="innerHTML"
    style="width: 100%; margin-top: 1.5rem;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
        <span style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500;">
            Ingestion Progress
        </span>
        <span style="color: #fff; font-family: 'JetBrains Mono', monospace; font-weight: 700;">
            {{ progress }}%
        </span>
    </div>

    <div style="width: 100%; height: 8px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden;">
        <div
            style="width: calc({{ progress }} * 1%); height: 100%; background: var(--grad-accent); box-shadow: 0 0 15px var(--accent-glow); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);">
        </div>
    </div>

    <p style="font-size: 0.8rem; color: var(--text-tertiary); margin-top: 1rem; font-weight: 600;">
        <i class="fas fa-microchip" style="margin-right: 8px; color: var(--accent-primary);"></i>
        VECTORIZING: <span style="color: var(--text-secondary);">{{ current_file }}</span>
    </p>
</div>
