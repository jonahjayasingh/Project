{% extends 'base.html' %}

{% block content %}
<div class="glass-card">
    <h2>Transaction Analysis</h2>
    <p style="text-align: center; opacity: 0.7; margin-bottom: 2rem;">Enter transaction details to detect potential
        fraud.</p>

    <form method="POST" action="{% url 'predict' %}">
        {% csrf_token %}

        <label for="amount">Transaction Amount ($)</label>
        <input type="number" step="0.01" name="amount" id="amount" placeholder="e.g. 125.50" required
            value="{{ amount|default:'' }}">

        <label for="category">Transaction Category</label>
        <select name="category" id="category" required>
            <option value="" disabled {% if not category %}selected{% endif %}>Select a category</option>
            {% for cat in categories %}
            <option value="{{ cat }}" {% if category==cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>

        <button type="submit">Analyze Transaction</button>
    </form>

    {% if prediction %}
    <div class="prediction-result {% if prediction == 'Fraudulent' %}result-fraud{% else %}result-legit{% endif %}">
        Result: {{ prediction }}
    </div>
    {% endif %}
</div>
{% endblock %}
